# Matter virtual devices using rs-matter SDK
#
# These are real Matter protocol devices that can be commissioned
# into a Matter fabric and used for testing bindings and ACLs.
#
# Usage:
#   docker compose up -d              # Start dimmable light
#   docker compose logs -f            # View logs (includes QR code)
#   docker compose down               # Stop devices
#
# Commissioning:
#   Look for the QR code in the logs, or use the manual pairing code.

services:
  dimmable-light:
    build: ./rust-device
    container_name: matter-dimmable-light
    environment:
      - MATTER_DISCRIMINATOR=3840
      - MATTER_PASSCODE=20202021
      - MATTER_PORT=5540
      - MATTER_DEVICE_NAME=Test Dimmable Light
      - MATTER_PERSIST_PATH=/data/matter.bin
      - RUST_LOG=info
    volumes:
      - dimmable-light-data:/data
    # Host networking required for mDNS discovery
    network_mode: host
    restart: unless-stopped

  # Additional devices can be added here with different discriminators/ports
  # Example: dimmer-switch, room-thermostat, etc.

volumes:
  dimmable-light-data:
