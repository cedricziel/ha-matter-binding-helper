# Mock Matter devices for development
#
# Usage:
#   docker compose up -d              # Start default device
#   docker compose logs -f            # View logs
#   docker compose down               # Stop devices
#
# Test API:
#   echo '{"cmd":"get_state"}' | nc localhost 5540

services:
  rust-light:
    build: ./rust-device
    container_name: matter-mock-light
    command:
      - --discriminator=3840
      - --passcode=20202021
      - --port=5540
      - --name=MockLight
      - --device-type=light
    ports:
      - "5540:5540"
    restart: unless-stopped

  rust-switch:
    build: ./rust-device
    container_name: matter-mock-switch
    command:
      - --discriminator=3841
      - --passcode=20202022
      - --port=5541
      - --name=MockSwitch
      - --device-type=switch
    ports:
      - "5541:5541"
    restart: unless-stopped
    profiles:
      - multi
