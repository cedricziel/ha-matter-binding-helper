services:
  homeassistant:
    container_name: ha-matter-binding-helper-dev
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      # Mount custom component for development
      - ./custom_components/matter_binding_helper:/config/custom_components/matter_binding_helper:ro
      # Persist HA configuration
      - ./dev-config:/config
    environment:
      - TZ=Europe/Berlin
    ports:
      - "8123:8123"
    # Allow HA to reach host network services (matter-server)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - matter-server

  matter-server:
    container_name: matter-server
    # Pinned so Dependabot (docker ecosystem) bumps it; the test fixtures read
    # this exact tag out of this file, so there is one source of truth.
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1.2
    volumes:
      - matter-server-data:/data
      - ./scripts:/scripts:ro
    environment:
      - TZ=Europe/Berlin
    # Host networking required for mDNS device discovery
    network_mode: host
    restart: unless-stopped

  # matter.js-based server — HA's drop-in replacement for python-matter-server
  # (same WebSocket API, port 5580). Off by default; `--profile matterjs` to use
  # it in dev. The e2e/integration suites read this tag for the [matterjs] matrix.
  matter-server-js:
    container_name: matter-server-js
    image: ghcr.io/matter-js/matterjs-server:1.0.0
    volumes:
      - matter-server-js-data:/data
    environment:
      - TZ=Europe/Berlin
    network_mode: host
    restart: unless-stopped
    profiles:
      - matterjs

  # Matter test device (rs-matter dimmable light)
  dimmable-light:
    build:
      context: ./devices/rust-device
      args:
        BINARY: dimmable_light
    container_name: matter-dimmable-light
    environment:
      - MATTER_DISCRIMINATOR=3840
      - MATTER_PASSCODE=20202021
      - MATTER_PORT=5540
      - MATTER_DEVICE_NAME=Test Dimmable Light
      - MATTER_PERSIST_PATH=/data/matter.bin
      - RUST_LOG=info
    volumes:
      - dimmable-light-data:/data
    # Host networking required for mDNS discovery
    network_mode: host
    restart: unless-stopped
    profiles:
      - devices

  # Matter test device (rs-matter on/off switch)
  on-off-switch:
    build:
      context: ./devices/rust-device
      args:
        BINARY: on_off_switch
    container_name: matter-on-off-switch
    environment:
      - MATTER_DISCRIMINATOR=3841
      - MATTER_PASSCODE=20202022
      - MATTER_PORT=5541
      - MATTER_DEVICE_NAME=Test On/Off Switch
      - MATTER_PERSIST_PATH=/data/matter.bin
      - RUST_LOG=info
    volumes:
      - on-off-switch-data:/data
    # Host networking required for mDNS discovery
    network_mode: host
    restart: unless-stopped
    profiles:
      - devices

  # Frontend development with hot reload
  frontend-dev:
    container_name: ha-matter-binding-helper-frontend
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./custom_components/matter_binding_helper/frontend:/output
    command: sh -c "npm install && npm run watch"
    profiles:
      - dev

volumes:
  matter-server-data:
    name: matter-server-data
  matter-server-js-data:
    name: matter-server-js-data
  dimmable-light-data:
    name: dimmable-light-data
  on-off-switch-data:
    name: on-off-switch-data
