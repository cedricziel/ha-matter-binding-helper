name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.15.20,<0.16"

      - name: Run ruff check
        run: ruff check custom_components/matter_binding_helper

      - name: Run ruff format check
        run: ruff format --check custom_components/matter_binding_helper

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  build-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devices/rust-device
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: devices/rust-device

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Run both Matter server backends as independent, required jobs. Don't let
      # one backend's failure cancel the other — we want both results.
      fail-fast: false
      matrix:
        backend: [python, matterjs]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run integration tests (${{ matrix.backend }})
        # tests/e2e needs host networking + real commissioning; it runs in the
        # dedicated e2e workflow, not here.
        env:
          MATTER_BACKENDS: ${{ matrix.backend }}
        run: python -m pytest tests/ -v --tb=short --ignore=tests/e2e
