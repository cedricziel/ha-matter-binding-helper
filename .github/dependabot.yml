---
version: 2
updates:
  # Python deps live in the root requirements*.txt files; the custom component's
  # manifest.json declares no requirements, so target the repo root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/devices/rust-device"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Matter server backend images (python-matter-server + matterjs-server) and
  # other pinned images in docker-compose.yml. The test fixtures read these tags
  # out of the compose file, so bumping here updates the [python]/[matterjs]
  # e2e matrix too.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
